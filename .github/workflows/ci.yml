name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interfaces/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: interfaces/web/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn build
      - run: yarn test

  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall app

  docker-smoke:
    name: Docker Compose (prod preview)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Copy env files
        run: |
          cp .env.docker.example .env.docker
          echo "JWT_SECRET_KEY=ci-smoke-test-secret-min-32-chars-long" >> .env.docker
      - run: docker compose -f docker-compose.prod.yml --env-file .env.docker build
      - run: docker compose -f docker-compose.prod.yml --env-file .env.docker up -d
      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 3
          done
          exit 1
      - run: curl -sf http://localhost:8080/ > /dev/null
      - run: docker compose -f docker-compose.prod.yml --env-file .env.docker down -v
